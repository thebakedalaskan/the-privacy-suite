name: Deploy

# Deploys only after CI passes on main, and only once infrastructure exists:
# set the repository variable DEPLOY_ENABLED=true when infra/README.md is done.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify deployment commit
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.commit.outputs.current }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Skip commits superseded on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          CURRENT_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          printf 'sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_SHA" = "$CURRENT_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'This commit has been superseded on main; its deployment is skipped.'
          fi

  api:
    name: API → Cloud Run
    needs: prepare
    if: needs.prepare.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no long-lived GCP keys in GitHub.
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/alcove/api:${{ needs.prepare.outputs.sha }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
      OBJECTS_ENDPOINT: ${{ vars.OBJECTS_ENDPOINT }}
      OBJECTS_BUCKET: ${{ vars.OBJECTS_BUCKET }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
      NEAR_AI_ENABLED: ${{ vars.NEAR_AI_ENABLED }}
      GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}', persist-credentials: false }
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud --project="$GCP_PROJECT_ID" auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - name: Build and push the image
        run: docker build -f apps/api/Dockerfile --build-arg ALCOVE_COMMIT="${{ needs.prepare.outputs.sha }}" -t "$IMAGE" . && docker push "$IMAGE"
      - name: Run database migrations
        # Migrations only shape tables: the job gets the database and nothing else, no keys or provider secrets.
        run: |
          SECRET_BINDINGS='DATABASE_URL=alcove-database-url:latest'
          gcloud --project="$GCP_PROJECT_ID" run jobs deploy alcove-migrate --image "$IMAGE" --region "$GCP_REGION" \
            --command node --args dist/migrate-cli.js \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 300s --cpu 1 --memory 512Mi \
            --set-env-vars "LOG_FORMAT=json,LOG_LEVEL=info" \
            --set-secrets "$SECRET_BINDINGS" --quiet
          gcloud --project="$GCP_PROJECT_ID" run jobs execute alcove-migrate --region "$GCP_REGION" --wait --quiet
      - name: Deploy the API
        run: |
          SECRET_BINDINGS='DATABASE_URL=alcove-database-url:latest,KMASTER=alcove-kmaster:latest,KSERVICE=alcove-kservice:latest,OBJECTS_ACCESS_KEY=alcove-objects-access-key:latest,OBJECTS_SECRET_KEY=alcove-objects-secret-key:latest,LIVEKIT_API_KEY=alcove-livekit-api-key:latest,LIVEKIT_API_SECRET=alcove-livekit-api-secret:latest'
          if [ "$NEAR_AI_ENABLED" = true ]; then
            SECRET_BINDINGS="$SECRET_BINDINGS,NEAR_AI_API_KEY=alcove-near-ai-api-key:latest"
          fi
          if [ "$GOOGLE_AUTH_ENABLED" = true ]; then
            SECRET_BINDINGS="$SECRET_BINDINGS,GOOGLE_CLIENT_ID=alcove-google-client-id:latest,GOOGLE_CLIENT_SECRET=alcove-google-client-secret:latest"
          fi
          gcloud --project="$GCP_PROJECT_ID" run deploy alcove-api --image "$IMAGE" --region "$GCP_REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --allow-unauthenticated --min 1 --max 1 --concurrency 1000 --session-affinity \
            --execution-environment gen2 --port 8080 --timeout 300s --cpu 1 --memory 2Gi --no-cpu-throttling \
            --set-env-vars "OBJECTS_ENDPOINT=$OBJECTS_ENDPOINT,OBJECTS_BUCKET=$OBJECTS_BUCKET,WEB_ORIGIN=$WEB_ORIGIN,API_URL=$API_ORIGIN,LIVEKIT_URL=$LIVEKIT_URL,NEAR_AI_BASE_URL=https://cloud-api.near.ai/v1,TREASURY_INTENTS_ACCOUNT=alcove-treasury.near,LOG_FORMAT=json,LOG_LEVEL=info" \
            --set-secrets "$SECRET_BINDINGS" --quiet
      - name: Health check
        run: |
          SERVICE_URL="$(gcloud --project="$GCP_PROJECT_ID" run services describe alcove-api --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SERVICE_URL/health" | tee /dev/stderr | grep -q '"livekit":"reachable"'

  web:
    name: Web → Cloudflare Pages
    needs: [prepare, api]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}', persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_ALCOVE_API_URL: ${{ vars.API_ORIGIN }}
        run: pnpm --filter @alcove/web build
      - name: Content security policy for this API origin
        env:
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
        run: node apps/web/scripts/csp.mjs apps/web/dist/client "${{ vars.API_ORIGIN }}" "$LIVEKIT_URL"
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm dlx wrangler@4.157.0 pages deploy apps/web/dist/client \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$DEPLOY_SHA"
