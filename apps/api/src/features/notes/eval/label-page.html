<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checking the judge</title>
<!-- The worksheet label-cli.ts fills in with the questions, cases and notes, in the JSON script element below. -->
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1c1b19; --ink-2: #625e56; --line: #e1ddd3;
    --hit: #fdefb8; --accent: #2b4c82; --accent-soft: #e5ecf7; --judge: #b07415;
    --kinder: #2b5f8f; --stricter: #9a3b3b; --different: #6b5a2a;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141412; --surface: #1d1c1a; --ink: #ecebe6; --ink-2: #a9a59b; --line: #36342f;
      --hit: #4d421a; --accent: #9dbbea; --accent-soft: #232c3b; --judge: #e2b46a;
      --kinder: #9dc3ea; --stricter: #ec9d9d; --different: #d8c38a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 96px; }
  .top { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; }
  .meta { color: var(--ink-2); font-size: 13px; margin: 4px 0; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 10px 0 14px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; }
  .big { font-size: 16px; }
  .tag { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; white-space: nowrap; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-right: 6px; }
  .lines { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; max-height: 380px; overflow: auto; overflow-wrap: anywhere; }
  .lines .hit { background: var(--hit); }
  .lines .gap { color: var(--ink-2); }
  details > summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 10px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .help { color: var(--ink-2); font-size: 13px; margin: 0 0 8px; }
  ul.help { padding-left: 18px; }
  ul.help li { margin: 2px 0; }
  .options { max-height: 440px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .options label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .options label:last-child { border-bottom: 0; }
  .options label:hover { background: var(--accent-soft); }
  .options input { margin-top: 4px; flex: none; }
  .options .group { padding: 5px 10px; font-size: 12px; color: var(--ink-2); background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .options label.judged { box-shadow: inset 4px 0 0 var(--judge); }
  .options label .said { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  .judge-key { color: var(--judge); font-size: 12px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .flag { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; }
  input[type=text] { width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); margin-top: 6px; }
  .verdict { border-left: 4px solid var(--accent); }
  .verdict.differ { border-left-color: var(--stricter); }
  .way { font-weight: 600; }
  .way.kinder { color: var(--kinder); }
  .way.stricter { color: var(--stricter); }
  .way.different { color: var(--different); }
  ul.plain { margin: 6px 0 0; padding-left: 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="worksheet">__WORKSHEET__</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('worksheet').textContent);
  const app = document.getElementById('app');
  const KEY = 'judge-labels:' + data.id;
  const total = data.questions.length;
  const KIND = { decision: 'decision', question: 'open question', action: 'follow-up' };

  // Answers live in this browser only; without storage (a private window) they last until the page closes.
  let state = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && typeof saved === 'object' && saved.answers && typeof saved.at === 'number') return saved;
    } catch (e) { /* nothing saved, or storage blocked */ }
    return { answers: {}, at: 0, view: 'ask' };
  })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked */ } };
  let draft = { at: -1, you: {}, caseWrong: false, note: '' };

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'checked' || k === 'disabled' || k === 'value') n[k] = v;
      else n.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.append(kid instanceof Node ? kid : String(kid));
    }
    return n;
  }

  const caseOf = (q) => data.cases[q.case];
  const notesOf = (q) => data.notes[q.notes];
  const itemOf = (q) => notesOf(q).items.find((i) => i.id === q.item);
  const expectedById = (q, id) => caseOf(q).expected.find((e) => e.id === id);
  const extraById = (q, id) => caseOf(q).acceptable.find((a) => a.id === id);
  const neverById = (q, id) => caseOf(q).never.find((n) => n.id === id);
  const ownerDue = (x) => (x.kind === 'action' ? ' (owner: ' + (x.owner || 'none') + '; due: ' + (x.due || 'none') + ')' : '');
  const lineText = (l) => '[' + l.t + '] ' + (l.who ? l.who + ': ' : '') + l.text + (l.unclear ? ' (unclear)' : '');
  const kindTag = (kind) => el('span', { class: 'tag' }, KIND[kind]);

  function noteItem(i) { return [el('span', { class: 'id' }, i.id), kindTag(i.kind), i.text + ownerDue(i)]; }
  function describe(q, label) {
    if (label === 'none') return 'nothing expected or acceptable';
    const e = expectedById(q, label);
    if (e) return label + ' "' + e.what + '"';
    const a = extraById(q, label);
    return a ? label + ' (acceptable) "' + a.text + '"' : label;
  }

  function excerpt(c, hits, around) {
    const keep = new Set();
    for (const h of hits) for (let i = h - around; i <= h + around; i++) if (i >= 0 && i < c.lines.length) keep.add(i);
    const box = el('div', { class: 'lines' });
    let last = -1;
    for (const i of [...keep].sort((a, b) => a - b)) {
      if (last >= 0 && i > last + 1) box.append(el('div', { class: 'gap' }, '…'));
      box.append(el('div', { class: hits.includes(i) ? 'hit' : null }, 'L' + (i + 1) + ' ' + lineText(c.lines[i])));
      last = i;
    }
    return box;
  }
  function whole(c, hits, open) {
    return el('details', { open: open },
      el('summary', null, 'The whole transcript (' + c.lines.length + ' lines)'),
      el('div', { class: 'lines' }, c.lines.map((l, i) => el('div', { class: hits.includes(i) ? 'hit' : null }, 'L' + (i + 1) + ' ' + lineText(l)))));
  }

  /** How you and the judge differ on one question: each difference, and which way it moves the scores. */
  function differences(q, you) {
    const out = [];
    if (q.q === 'item') {
      const judged = q.judge.match || 'none';
      if (judged !== you.match) {
        if (judged === 'none') out.push({ way: 'stricter', say: 'The judge matched it to nothing; you matched it to ' + describe(q, you.match) + '.' });
        else if (you.match === 'none') out.push({ way: 'kinder', say: 'The judge matched it to ' + describe(q, judged) + '; you matched it to nothing.' });
        else out.push({ way: 'different', say: 'The judge matched it to ' + describe(q, judged) + '; you to ' + describe(q, you.match) + '.' });
      }
      const judgedRepeat = q.judge.same_as !== null;
      const youRepeat = you.same_as !== 'no';
      if (judgedRepeat && !youRepeat) out.push({ way: 'stricter', say: 'The judge called it the same note as ' + q.judge.same_as + '; you didn\'t.' });
      if (!judgedRepeat && youRepeat) out.push({ way: 'kinder', say: 'You called it the same note as ' + you.same_as + '; the judge didn\'t.' });
    } else if (q.q === 'due') {
      if (q.judge.due_ok && !you.due_ok) out.push({ way: 'kinder', say: 'The judge called the due dates the same; you didn\'t.' });
      if (!q.judge.due_ok && you.due_ok) out.push({ way: 'stricter', say: 'The judge called the due dates different; you didn\'t.' });
    } else {
      if (q.judge.violated && !you.violated) out.push({ way: 'stricter', say: 'The judge found it broken' + (q.judge.where ? ' (in ' + q.judge.where + ')' : '') + '; you didn\'t.' });
      if (!q.judge.violated && you.violated) out.push({ way: 'kinder', say: 'You found it broken; the judge didn\'t.' });
    }
    return out;
  }
  const complete = (q, you) => (q.q === 'item' ? Boolean(you.match && you.same_as) : q.q === 'due' ? typeof you.due_ok === 'boolean' : typeof you.violated === 'boolean');
  const WAY_WORDS = { kinder: 'Judge kinder than you', stricter: 'Judge stricter than you', different: 'A different item' };

  function options(name, groups, chosen, judged, locked, onPick) {
    const box = el('div', { class: 'options' });
    for (const g of groups) {
      if (g.title) box.append(el('div', { class: 'group' }, g.title));
      for (const o of g.options) {
        box.append(el('label', { class: locked && o.value === judged ? 'judged' : null },
          el('input', { type: 'radio', name: name, value: o.value, checked: chosen === o.value, disabled: locked, onchange: () => onPick(o.value) }),
          el('span', null, o.label, locked && o.value === judged ? el('span', { class: 'judge-key' }, '  ← the judge') : null)));
      }
    }
    return box;
  }

  function header() {
    const answered = Object.keys(state.answers).length;
    return [
      el('div', { class: 'top' },
        el('h1', null, 'Checking the judge'),
        el('span', { class: 'meta' }, data.folder + ' · ' + answered + ' of ' + total + ' answered · ',
          el('button', { class: 'link', onclick: () => { state.view = 'results'; save(); render(); } }, 'results'))),
      el('div', { class: 'bar' }, el('div', { style: 'width:' + (100 * answered / total) + '%' }))
    ];
  }

  function context(q) {
    const c = caseOf(q);
    const n = notesOf(q);
    const cards = [];
    if (q.q === 'item') {
      const item = itemOf(q);
      cards.push(el('div', { class: 'card' }, el('h2', null, 'The note item'), el('div', { class: 'big' }, noteItem(item))));
      cards.push(el('div', { class: 'card' },
        el('h2', null, item.lines.length ? 'Around the lines it cites (highlighted)' : 'It cites no lines'),
        item.lines.length ? excerpt(c, item.lines, 4) : null,
        whole(c, item.lines, !item.lines.length)));
    } else if (q.q === 'due') {
      const item = itemOf(q);
      const e = expectedById(q, q.expected);
      cards.push(el('div', { class: 'card' },
        el('h2', null, 'The note item, which the judge matched to ' + e.id),
        el('div', { class: 'big' }, noteItem(item)),
        el('p', { class: 'meta' }, 'Expected: ', el('span', { class: 'id' }, e.id), e.what + ' (owner: ' + (e.owner || 'none') + ')')));
      cards.push(el('div', { class: 'card' },
        el('h2', null, 'The two due dates'),
        el('table', null,
          el('tr', null, el('th', null, 'In the notes'), el('td', null, item.due || 'none')),
          el('tr', null, el('th', null, 'Expected'), el('td', null, e.due)))));
      const hits = [...item.lines, e.at];
      cards.push(el('div', { class: 'card' }, el('h2', null, 'Around the lines it cites and where it was said (highlighted)'), excerpt(c, hits, 4), whole(c, hits, false)));
    } else {
      const never = neverById(q, q.never);
      cards.push(el('div', { class: 'card' }, el('h2', null, 'Must never appear'), el('div', { class: 'big' }, el('span', { class: 'id' }, never.id), never.text)));
      cards.push(el('div', { class: 'card' },
        el('h2', null, 'The notes'),
        el('p', null, el('strong', null, 'Summary: '), n.prose.summary || '(none)'),
        n.prose.chapters.length ? el('div', null, el('strong', null, 'Chapters'), el('ul', { class: 'plain' }, n.prose.chapters.map((ch) => el('li', null, ch.title + ': ' + ch.summary)))) : null,
        el('div', { style: 'margin-top:8px' }, el('strong', null, 'Items'), el('ul', { class: 'plain' }, n.items.map((i) => el('li', null, noteItem(i))))),
        whole(c, [], false)));
    }
    return cards;
  }

  const tips = (...lines) => el('ul', { class: 'help' }, lines.map((l) => el('li', null, l)));

  function questionForm(q, you, locked, changed) {
    const c = caseOf(q);
    // Only what depends on the answer is updated, so a long list of options keeps its scroll.
    const set = (k, v) => { you[k] = v; changed(); };
    if (q.q === 'item') {
      const item = itemOf(q);
      const earlier = notesOf(q).items.slice(0, notesOf(q).items.findIndex((i) => i.id === item.id));
      if (!earlier.length && !you.same_as) you.same_as = 'no';
      const which = el('fieldset', null,
        el('legend', null, 'Which expected item does ', el('span', { class: 'id' }, item.id), '"' + item.text + '" say?'),
        tips(
          'Go by meaning, not wording or which list it\'s in.',
          'Says two things? Pick the main one.',
          'An expected item and an extra both fit? Pick the one that\'s the same type as the note (decision, question or follow-up).'),
        options('match', [
          { title: 'Expected', options: c.expected.map((e) => ({ value: e.id, label: [el('span', { class: 'id' }, e.id), kindTag(e.kind), e.what + ownerDue(e) + ' ', el('span', { class: 'said' }, 'said at ' + e.mark)] })) },
          { title: 'Acceptable extras', options: c.acceptable.map((a) => ({ value: a.id, label: [el('span', { class: 'id' }, a.id), a.text] })) },
          { title: null, options: [{ value: 'none', label: 'Neither: it states nothing expected or acceptable' }] }
        ], you.match, q.judge.match || 'none', locked, (v) => set('match', v)));
      const repeat = earlier.length ? el('fieldset', { style: 'margin-top:14px' },
        el('legend', null, 'Is ', el('span', { class: 'id' }, item.id), '"' + item.text + '" the same note as one of these?'),
        tips('Two parts of one task, like "update the plan" and "tell the agency", aren\'t the same.'),
        options('same_as', [
          { title: null, options: [{ value: 'no', label: 'No, none of them' }] },
          { title: 'Yes, the same as:', options: earlier.map((i) => ({ value: i.id, label: noteItem(i) })) }
        ], you.same_as, q.judge.same_as || 'no', locked, (v) => set('same_as', v))) : null;
      return [which, repeat];
    }
    if (q.q === 'due') {
      return [el('fieldset', null,
        el('legend', null, 'Does the due date in the notes say the same as the expected one?'),
        el('p', { class: 'help' }, 'In any wording or language. An expected date with "or no due date (either is right)" accepts either.'),
        options('due_ok', [{ title: null, options: [{ value: 'yes', label: 'Yes, the same' }, { value: 'no', label: 'No, different' }] }],
          you.due_ok === undefined ? null : you.due_ok ? 'yes' : 'no', q.judge.due_ok ? 'yes' : 'no', locked, (v) => set('due_ok', v === 'yes')))];
    }
    return [el('fieldset', null,
      el('legend', null, 'Do the notes break it?'),
      tips(
        'Yes if a note, the summary or a chapter says it as fact or as decided.',
        'No if they only say it was suggested, asked, unclear, undecided, or decided and then changed.'),
      options('violated', [{ title: null, options: [{ value: 'yes', label: 'Yes, the notes state it' }, { value: 'no', label: 'No' }] }],
        you.violated === undefined ? null : you.violated ? 'yes' : 'no', q.judge.violated ? 'yes' : 'no', locked, (v) => set('violated', v === 'yes')))];
  }

  function judgeSaid(q) {
    const reason = q.judge.reason ? ' Its reason: "' + q.judge.reason + '"' : '';
    if (q.q === 'item') return 'It matched it to ' + describe(q, q.judge.match || 'none') + ', ' + (q.judge.same_as ? 'the same note as ' + q.judge.same_as : 'not the same as any other note') + '.' + reason;
    if (q.q === 'due') return 'It called the due dates ' + (q.judge.due_ok ? 'the same' : 'different') + '.' + reason;
    return 'It found it ' + (q.judge.violated ? 'broken' + (q.judge.where ? ' (in ' + q.judge.where + ')' : '') : 'not broken') + '.' + reason;
  }

  function go(i) { state.at = Math.max(0, Math.min(total - 1, i)); state.view = 'ask'; save(); render(); window.scrollTo(0, 0); }

  function renderAsk() {
    const i = state.at;
    const q = data.questions[i];
    const c = caseOf(q);
    const done = state.answers[i];
    if (!done && draft.at !== i) draft = { at: i, you: {}, caseWrong: false, note: '' };
    const you = done ? (done.you || {}) : draft.you;
    const locked = Boolean(done);

    const body = el('div');
    const refresh = () => { app.replaceChildren(); renderAsk(); };
    app.append(...header(),
      el('p', { class: 'meta' }, 'Question ' + (i + 1) + ' of ' + total + ' · ' + c.title + ' (' + q.case + '), run ' + q.run +
        (c.kind === 'room' ? ' · a room recording: nobody can tell who spoke' : '')),
      ...context(q), body);

    const check = el('button', { class: 'primary', disabled: !complete(q, you), onclick: () => { state.answers[i] = { skipped: false, you: Object.assign({}, you), caseWrong: draft.caseWrong, note: draft.note }; save(); refresh(); } }, 'Check against the judge');
    const form = el('div', { class: 'card' }, questionForm(q, you, locked, () => { check.disabled = !complete(q, you); }));
    check.disabled = !complete(q, you);
    const flag = el('div', null,
      el('label', { class: 'flag' },
        el('input', { type: 'checkbox', checked: locked ? Boolean(done.caseWrong) : draft.caseWrong, disabled: locked, onchange: (ev) => { draft.caseWrong = ev.target.checked; } }),
        'The case itself looks wrong to me (what it expects, or what it says must never appear)'),
      el('input', { type: 'text', placeholder: 'A note, if you want one (why, or what you\'d change)', value: locked ? (done.note || '') : draft.note, disabled: locked, oninput: (ev) => { draft.note = ev.target.value; } }));
    form.append(flag);
    body.append(form);

    if (locked && !done.skipped) {
      const diffs = differences(q, done.you);
      body.append(el('div', { class: 'card verdict' + (diffs.length ? ' differ' : '') },
        el('h2', null, 'The judge'),
        el('p', null, judgeSaid(q)),
        diffs.length
          ? el('ul', { class: 'plain' }, diffs.map((d) => el('li', null, el('span', { class: 'way ' + d.way }, WAY_WORDS[d.way] + ': '), d.say)))
          : el('p', null, el('strong', null, 'You agree.'))));
    } else if (locked) {
      body.append(el('div', { class: 'card verdict' }, el('h2', null, 'Skipped'), el('p', null, 'You couldn\'t tell. ' + judgeSaid(q))));
    }

    const row = el('div', { class: 'row' },
      el('button', { onclick: () => go(i - 1), disabled: i === 0 }, '← Previous'),
      el('span', { class: 'spacer' }));
    if (!locked) {
      row.append(
        el('button', { onclick: () => { state.answers[i] = { skipped: true, you: null, caseWrong: draft.caseWrong, note: draft.note }; save(); refresh(); } }, 'Can\'t tell: skip'),
        check);
    } else {
      const next = data.questions.findIndex((_, j) => j > i && !state.answers[j]);
      row.append(next >= 0
        ? el('button', { class: 'primary', onclick: () => go(next) }, 'Next question →')
        : el('button', { class: 'primary', onclick: () => { state.view = 'results'; save(); render(); } }, 'See the results'));
      if (i + 1 < total && next !== i + 1) row.append(el('button', { onclick: () => go(i + 1) }, 'Next →'));
    }
    body.append(row);
  }

  function about(q) {
    if (q.q === 'never') { const n = neverById(q, q.never); return n.id + ' ' + n.text; }
    const item = itemOf(q);
    return item.id + ' ' + item.text + (q.q === 'due' ? ' (due: ' + (item.due || 'none') + '; expected: ' + expectedById(q, q.expected).due + ')' : '');
  }
  const QUESTION_NAMES = { item: 'Which item, and same notes', due: 'Due dates', never: 'Never items' };

  function tally() {
    const rows = data.questions.map((q, i) => ({ q, i, a: state.answers[i] })).filter((r) => r.a && !r.a.skipped);
    const withDiffs = rows.map((r) => Object.assign(r, { diffs: differences(r.q, r.a.you) }));
    return withDiffs;
  }

  function renderResults() {
    const rows = tally();
    const skipped = data.questions.filter((_, i) => state.answers[i] && state.answers[i].skipped).length;
    const agreed = rows.filter((r) => !r.diffs.length).length;
    const ways = { kinder: 0, stricter: 0, different: 0 };
    for (const r of rows) for (const d of r.diffs) ways[d.way]++;
    const pct = (a, b) => (b ? Math.round((100 * a) / b) + '%' : '–');

    app.append(...header());
    app.append(el('div', { class: 'card' },
      el('h2', null, 'Results so far'),
      el('p', { class: 'big' }, rows.length
        ? 'You and the judge agreed on ' + agreed + ' of ' + rows.length + ' questions (' + pct(agreed, rows.length) + ').'
        : 'Nothing answered yet.'),
      el('p', { class: 'meta' }, (total - rows.length - skipped) + ' not answered yet, ' + skipped + ' skipped.'),
      el('table', null,
        el('tr', null, el('th', null, 'Question'), el('th', null, 'Answered'), el('th', null, 'Agreed')),
        ['item', 'due', 'never'].map((k) => {
          const of = rows.filter((r) => r.q.q === k);
          return el('tr', null, el('td', null, QUESTION_NAMES[k]), el('td', { class: 'num' }, of.length), el('td', { class: 'num' }, of.filter((r) => !r.diffs.length).length + ' (' + pct(of.filter((r) => !r.diffs.length).length, of.length) + ')'));
        }))));

    app.append(el('div', { class: 'card' },
      el('h2', null, 'Which way the differences go'),
      el('ul', { class: 'plain' },
        el('li', null, el('span', { class: 'way kinder' }, 'Judge kinder than you: ' + ways.kinder), '. It gives credit you wouldn\'t: an item you\'d call invented, a duplicate note or due date it let pass, a never-list break it missed. These make the scores look better than they are.'),
        el('li', null, el('span', { class: 'way stricter' }, 'Judge stricter than you: ' + ways.stricter), '. It takes away credit you\'d give. These make the scores look worse than they are.'),
        el('li', null, el('span', { class: 'way different' }, 'A different item: ' + ways.different), '. You both give credit, for different expected items, which can move recall either way.')),
      el('p', { class: 'meta' }, 'A few differences either way are normal. What matters is a lean: many more one way than the other, or the same kind of call again and again.')));

    const differ = rows.filter((r) => r.diffs.length);
    if (differ.length) {
      app.append(el('div', { class: 'card' },
        el('h2', null, 'Where you differ (' + differ.length + ')'),
        el('table', null,
          el('tr', null, el('th', null, '#'), el('th', null, 'Case'), el('th', null, 'About'), el('th', null, 'The difference'), el('th', null, 'Your note')),
          differ.map((r) => el('tr', null,
            el('td', { class: 'num' }, el('button', { class: 'link', onclick: () => go(r.i) }, String(r.i + 1))),
            el('td', null, r.q.case + ' run ' + r.q.run),
            el('td', null, about(r.q)),
            el('td', null, r.diffs.map((d) => el('div', null, el('span', { class: 'way ' + d.way }, WAY_WORDS[d.way] + ': '), d.say)), r.q.judge.reason ? el('div', { class: 'meta' }, 'Judge\'s reason: ' + r.q.judge.reason) : null),
            el('td', null, r.a.note || ''))))));
    }

    const flagged = data.questions.map((q, i) => ({ q, i, a: state.answers[i] })).filter((r) => r.a && r.a.caseWrong);
    if (flagged.length) {
      app.append(el('div', { class: 'card' },
        el('h2', null, 'Cases you think are wrong (' + flagged.length + ')'),
        el('ul', { class: 'plain' }, flagged.map((r) => el('li', null,
          el('button', { class: 'link', onclick: () => go(r.i) }, '#' + (r.i + 1)), ' ' + r.q.case + ': ' + about(r.q) + (r.a.note ? ' — ' + r.a.note : ''))))));
    }

    const first = data.questions.findIndex((_, j) => !state.answers[j]);
    app.append(el('div', { class: 'row' },
      el('button', { class: 'primary', onclick: () => go(first >= 0 ? first : state.at) }, first >= 0 ? 'Carry on answering' : 'Back to the questions'),
      el('button', { onclick: download }, 'Save the answers as a file'),
      el('span', { class: 'spacer' }),
      el('button', { onclick: () => { if (window.confirm('Clear every answer and start again?')) { state = { answers: {}, at: 0, view: 'ask' }; save(); render(); } } }, 'Start over')));
  }

  function download() {
    const rows = data.questions.map((q, i) => {
      const a = state.answers[i];
      return {
        n: i + 1, case: q.case, run: q.run, question: q.q, about: about(q), judge: q.judge,
        you: !a ? null : a.skipped ? 'skipped' : a.you,
        differences: a && !a.skipped ? differences(q, a.you).map((d) => d.way + ': ' + d.say) : null,
        caseLooksWrong: a ? Boolean(a.caseWrong) : null,
        note: a && a.note ? a.note : null
      };
    });
    const blob = new Blob([JSON.stringify({ worksheet: data.id, folder: data.folder, rows: rows }, null, 2)], { type: 'application/json' });
    const link = el('a', { href: URL.createObjectURL(blob), download: 'judge-labels-' + data.folder + '.json' });
    document.body.append(link);
    link.click();
    link.remove();
  }

  function render() {
    app.replaceChildren();
    if (state.view === 'results') renderResults();
    else renderAsk();
  }
  render();
})();
</script>
</body>
</html>
